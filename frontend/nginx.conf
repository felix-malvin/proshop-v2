server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default Nginx hanya 1 MB. Gambar produk bisa lebih besar.
    client_max_body_size 10m;

    # DNS internal Docker. valid=10s membuat Nginx mencari ulang
    # IP backend setiap 10 detik, bukan hanya sekali saat start.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://proshop-backend:5000;

    # Request API diteruskan ke container backend lewat Docker Network
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gambar hasil upload admin disimpan di backend
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # File JS dan CSS hasil build memakai hash di nama file, aman di-cache lama
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html tidak boleh di-cache agar versi baru langsung terlihat
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Route React (misalnya /admin/productlist) dikembalikan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}